<script>
var RVAuth={
  getUser:function(){try{return JSON.parse(localStorage.getItem('rv_user'));}catch(e){return null;}},
  setUser:function(d){localStorage.setItem('rv_user',JSON.stringify(d));},
  logout:function(){localStorage.removeItem('rv_user');window.location.href='index.html';},
  // Generate approval code from email (deterministic)
  genCode:function(email){
    var s=email.toLowerCase().trim()+'RV_RENEWABLES_VAULT_2026';
    var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
    var code=Math.abs(h).toString(36).toUpperCase();
    while(code.length<8){code='0'+code;}
    return code.substring(0,8);
  },
  // Verify code entered by investor
  verifyCode:function(email,code){
    return code.toUpperCase().trim()===this.genCode(email);
  }
};
</script>

function applyCode() {
  var u = RVAuth.getUser();
  var code = document.getElementById('codeInput').value.trim().toUpperCase();
  var err  = document.getElementById('codeErr');
  if(!code){ err.style.display='block'; err.textContent='Please enter your approval code.'; return; }
  if(RVAuth.verifyCode(u.email, code)){
    u.approved = true;
    RVAuth.setUser(u);
    var users = JSON.parse(localStorage.getItem('rv_users')||'[]');
    for(var i=0;i<users.length;i++){ if(users[i].email===u.email){ users[i].approved=true; } }
    localStorage.setItem('rv_users',JSON.stringify(users));
    // Reload with approved view
    renderDash(u);
  } else {
    err.style.display='block';
    err.textContent='Incorrect code. Please check and try again, or contact contact@renewablesvault.com.';
  }
}

function expressInterest(dealId, dealType) {
  var u = RVAuth.getUser();
  var btn = event.target;
  btn.disabled=true; btn.textContent='Sending...';

  fetch('https://api.web3forms.com/submit', {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({
      access_key:'615b6c70-27cb-4e3d-a889-b332649aeef0',
      subject:'💰 Investor Interest — '+dealId+' — '+u.firstName+' '+u.lastName,
      name: u.firstName+' '+u.lastName,
      email: u.email,
      message: [
        '═══════════════════════════════',
        'INVESTOR INTEREST EXPRESSED',
        '═══════════════════════════════',
        'Deal ID:       '+dealId,
        'Deal Type:     '+dealType,
        'Investor:      '+u.firstName+' '+u.lastName,
        'Email:         '+u.email,
        'Organisation:  '+u.org,
        'Investor Type: '+u.investorType,
        'Ticket Size:   '+(u.ticket||'Not specified'),
        'Date:          '+new Date().toLocaleDateString(),
        '═══════════════════════════════',
        'ACTION: Follow up to discuss deal details, share NDA, and progress to term sheet.'
      ].join('\n')
    })
  }).finally(function(){
    btn.textContent = '✓ Interest Registered — Our team will be in touch';
    btn.style.background = '#16a34a';
    btn.disabled = true;
  });
}
