*,*::before,*::after{box-sizing:border-box;}
body{font-family:'Inter',sans-serif;margin:0;padding:0;background:#f0f5f2;}
.nav-wrap{position:fixed;top:0;width:100%;z-index:50;background:rgba(7,23,12,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(74,222,128,0.10);}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 48px;height:68px;
  display:flex;align-items:center;justify-content:space-between;}
.nav-links{display:flex;gap:24px;}
.nav-links a{font-size:12px;font-weight:600;color:#bccabb;text-decoration:none;}
.nav-links a:hover{color:#4ADE80;}
.footer-wrap{background:#031107;border-top:1px solid rgba(74,222,128,0.08);padding:48px;}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;
  align-items:flex-start;flex-wrap:wrap;gap:24px;}
.footer-links a{font-size:12px;color:#bccabb;text-decoration:none;margin-left:20px;}
.footer-links a:hover{color:#4ADE80;}
.card{background:#fff;border-radius:12px;border:1px solid #d1e8d8;padding:28px;}
.card-accent{border-top:3px solid #2C7C3B;}
.step-active{background:#dcfce7;color:#166534;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.step-next{background:#dbeafe;color:#1d4ed8;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.step-pending{background:#f3f4f6;color:#9ca3af;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.badge-pending{background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;
  padding:4px 12px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;}
.badge-done{background:#dcfce7;color:#166534;font-size:11px;font-weight:700;
  padding:4px 12px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;}
.inv-tile{background:#162a1d;border:1px solid rgba(74,222,128,0.12);border-radius:10px;
  padding:20px;position:relative;overflow:hidden;text-align:center;}
.inv-tile-lock{position:absolute;inset:0;background:rgba(15,31,20,.75);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;border-radius:10px;}
.step-line-done{border-left:2px solid #4ADE80;margin-left:15px;padding-left:20px;
  padding-bottom:20px;position:relative;}
.step-line-pending{border-left:2px dashed #d1e8d8;margin-left:15px;padding-left:20px;
  padding-bottom:20px;position:relative;}
.step-line-last{margin-left:15px;padding-left:20px;position:relative;}
.step-icon{position:absolute;left:-17px;top:0;}
@media(max-width:768px){.nav-links{display:none;}.nav-inner{padding:0 20px;}
  .footer-wrap{padding:40px 20px;}}
</style>

    <div id="navAuth" style="display:flex;align-items:center;gap:12px;"></div>
  </div>
</nav>
<script>
var RVAuth={
  getUser:function(){try{return JSON.parse(localStorage.getItem('rv_user'));}catch(e){return null;}},
  logout:function(){localStorage.removeItem('rv_user');window.location.href='index.html';}
};
</script>
<script>
(function(){
  var u=RVAuth.getUser();var el=document.getElementById('navAuth');if(!el)return;
  if(u){var d=u.type==='investor'?'dashboard-investor.html':'dashboard-developer.html';
    el.innerHTML='<span style="font-size:12px;color:#bccabb;">Hi, '+u.firstName+'</span>'+
    '<a href="'+d+'" style="font-size:12px;font-weight:700;border:1px solid #4ADE80;color:#4ADE80;padding:8px 18px;border-radius:6px;text-decoration:none;">My Account</a>'+
    '<a href="#" onclick="RVAuth.logout();return false;" style="font-size:12px;color:#869486;text-decoration:none;">Logout</a>';
  }else{
    el.innerHTML='<a href="login.html" style="font-size:12px;font-weight:600;color:#bccabb;text-decoration:none;">Login</a>'+
    '<a href="register.html" style="font-size:12px;font-weight:700;border:1px solid #4ADE80;color:#4ADE80;padding:8px 18px;border-radius:6px;text-decoration:none;">Register Now</a>';
  }
})();
</script>
<div style="padding-top:68px;">
<div style="padding:48px;min-height:80vh;" id="dashContent">
  <div style="text-align:center;padding:40px;color:#6b7280;">Loading...</div>
</div>
<script>
(function(){
  var u = RVAuth.getUser();
  if(!u){ window.location.href='login.html'; return; }
  if(u.type!=='developer'){ window.location.href='dashboard-investor.html'; return; }

  var html = '<div style="max-width:1000px;margin:0 auto;">';

  // Header
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:16px;">';
  html += '<div>';
  html += '<div style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#2C7C3B;margin-bottom:6px;">DEVELOPER DASHBOARD</div>';
  html += '<h1 style="font-size:26px;font-weight:700;color:#1A472A;margin:0;">Welcome, '+u.firstName+' '+u.lastName+'.</h1>';
  html += '<p style="font-size:14px;color:#6b7280;margin:6px 0 0;">'+u.company+' &middot; '+u.energy+' &middot; '+u.country+'</p>';
  html += '</div>';
  html += '<button onclick="RVAuth.logout()" style="font-size:13px;color:#6b7280;background:#fff;border:1px solid #d1e8d8;border-radius:6px;padding:8px 18px;cursor:pointer;">Logout</button>';
  html += '</div>';

  // Status banner
  html += '<div style="background:#fff;border-radius:12px;border:1px solid #d1e8d8;border-left:4px solid #4ADE80;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;">';
  html += '<span class="material-symbols-outlined" style="color:#16a34a;font-size:28px;">check_circle</span>';
  html += '<div><div style="font-size:15px;font-weight:700;color:#1A472A;margin-bottom:4px;">Project submission received</div>';
  html += '<p style="font-size:14px;color:#6b7280;margin:0;line-height:1.6;">Thank you for submitting your project. Our team will review the details and follow up within <strong>5 business days</strong>.</p></div>';
  html += '</div>';

  // Grid
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">';

  // Profile card
  html += '<div class="card card-accent">';
  html += '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2C7C3B;margin-bottom:20px;">Your Profile</div>';
  var fields = [
    ['Full Name', u.firstName+' '+u.lastName, true],
    ['Email', u.email, false],
    ['Company', u.company, true],
    ['Energy Type', u.energy, true],
    ['Country', u.country, true],
    ['Asset Stage', u.stage, false],
    ['Registered', u.registered, false]
  ];
  html += '<div style="display:flex;flex-direction:column;gap:14px;">';
  for(var i=0;i<fields.length;i++){
    html += '<div>';
    html += '<div style="font-size:10px;color:#9ca3af;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;">'+fields[i][0]+'</div>';
    html += '<div style="font-size:14px;'+(fields[i][2]?'font-weight:600;color:#1c2b1f;':'color:#374151;')+'">'+fields[i][1]+'</div>';
    html += '</div>';
  }
  html += '<div><span class="badge-done">Submission Received</span></div>';
  html += '</div></div>';

  // Journey card
  html += '<div class="card">';
  html += '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2C7C3B;margin-bottom:20px;">What Happens Next</div>';

  var steps = [
    ['Project submitted', 'Received on '+u.registered, 'done'],
    ['Initial RARE™ review', 'Our team assesses your project against our underwriting criteria and follows up within 5 business days.', 'next'],
    ['Discovery call', 'We discuss your asset, contracted revenue, capital requirements, and the RPA structure.', 'pending'],
    ['Term sheet', 'If eligible, we issue a term sheet outlining the advance amount, tenor, and payment waterfall.', 'pending'],
    ['Due diligence & structuring', 'Commercial, technical, legal, and financial due diligence. SPV and escrow setup.', 'pending'],
    ['Capital deployed', 'Funds released within our 60–75 day closing framework.', 'last']
  ];

  for(var s=0;s<steps.length;s++){
    var st = steps[s];
    var lineClass = st[2]==='done' ? 'step-line-done' : (st[2]==='last' ? 'step-line-last' : 'step-line-pending');
    var numClass  = st[2]==='done' ? 'step-active' : (st[2]==='next' ? 'step-next' : 'step-pending');
    var numContent = st[2]==='done' ? '<span class="material-symbols-outlined" style="font-size:16px;">check</span>' : (s+1).toString();
    var titleColor = (st[2]==='pending'||st[2]==='last') ? '#9ca3af' : '#1A472A';
    var textColor  = (st[2]==='pending'||st[2]==='last') ? '#9ca3af' : '#6b7280';
    html += '<div class="'+lineClass+'">';
    html += '<div class="'+numClass+' step-icon">'+numContent+'</div>';
    html += '<div style="font-size:14px;font-weight:700;color:'+titleColor+';">'+st[0]+'</div>';
    html += '<div style="font-size:13px;color:'+textColor+';margin-top:3px;">'+st[1]+'</div>';
    html += '</div>';
  }
  html += '</div>'; // end journey card
  html += '</div>'; // end grid

  // Project description
  if(u.description){
    html += '<div class="card" style="margin-bottom:24px;">';
    html += '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2C7C3B;margin-bottom:12px;">Your Project Description</div>';
    html += '<p style="font-size:15px;color:#374151;margin:0;line-height:1.75;">'+u.description+'</p>';
    html += '</div>';
  }

  // Actions
  html += '<div style="display:flex;gap:14px;flex-wrap:wrap;">';
  html += '<a href="developers.html" style="font-size:14px;font-weight:600;color:#2C7C3B;border:1px solid #d1e8d8;padding:10px 20px;border-radius:6px;text-decoration:none;background:#fff;">Submit Another Project</a>';
  html += '<a href="contact.html" style="font-size:14px;font-weight:600;color:#6b7280;border:1px solid #d1e8d8;padding:10px 20px;border-radius:6px;text-decoration:none;background:#fff;">Contact Our Team</a>';
  html += '</div>';

  html += '</div>'; // close max-width
  document.getElementById('dashContent').innerHTML = html;
})();
</script></div>
